name: Publier l'application (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Copie de secours de la version précédente (/precedente/)
        continue-on-error: true
        run: |
          git fetch --tags -q
          CUR=$(git rev-parse HEAD^{tree})
          PREV=$(node -e '
            const {execSync}=require("child_process"); const l=require("./versions.json"); const cur=process.argv[1];
            const ref=(e)=>{ for (const r of [e.tag, e.commit].filter(Boolean)) { try { execSync("git rev-parse -q --verify "+r+"^{commit}",{stdio:"ignore"}); return r; } catch(x){} } return ""; };
            for (const e of l) { const r=ref(e); if (!r) continue; const t=execSync("git rev-parse "+r+"^{tree}").toString().trim(); if (t!==cur) { console.log(r); break; } }' "$CUR")
          [ -z "$PREV" ] && { echo "Pas encore de version précédente"; exit 0; }
          git worktree add -q /tmp/prev "$PREV"
          (cd /tmp/prev && npm ci --no-audit --no-fund && npm run build)
          mkdir -p dist/precedente && cp /tmp/prev/dist/index.html /tmp/prev/dist/version.json dist/precedente/
          echo "Copie de secours : $PREV"
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
