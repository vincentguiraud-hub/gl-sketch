name: Revenir à une version sauvegardée
# Remet en ligne une version sauvegardée.
#  - tag vide : « version précédente » = la sauvegarde la plus récente différente de la version actuelle
#  - tag = version/1.3.4, sauvegarde/... ou identifiant de commit : cette version précise
# L'état actuel est lui-même sauvegardé avant, pour pouvoir annuler le retour arrière.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à remettre (vide = version précédente)"
        required: false
        default: ""
      issue:
        description: "Ticket à informer (facultatif)"
        required: false
        default: ""
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: assistant
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WANT: ${{ github.event.inputs.tag }}
      ISSUE: ${{ github.event.inputs.issue }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Restaurer
        id: r
        run: |
          git config user.name "Assistant Claude (G&L Sketch)"
          git config user.email "noreply@anthropic.com"
          git fetch --tags -q
          CUR=$(git rev-parse HEAD^{tree})
          # sans version précisée : la version suivante dans versions.json (la plus récente différente de l'actuelle)
          if [ -n "$WANT" ]; then TARGET="$WANT"; else
            TARGET=$(node -e '
              const {execSync}=require("child_process"); const l=require("./versions.json"); const cur=process.argv[1];
              const ref=(e)=>{ for (const r of [e.tag, e.commit].filter(Boolean)) { try { execSync("git rev-parse -q --verify "+r+"^{commit}",{stdio:"ignore"}); return r; } catch(x){} } return ""; };
              for (const e of l) { if (e.sansAssistant) continue; const r=ref(e); if (!r) continue; const t=execSync("git rev-parse "+r+"^{tree}").toString().trim(); if (t!==cur) { console.log(r); break; } }' "$CUR")
          fi
          if [ -z "$TARGET" ] || ! git rev-parse -q --verify "$TARGET^{commit}" >/dev/null; then echo "none=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          NOW="sauvegarde/$(TZ=Europe/Paris date +%Y-%m-%d_%Hh%M%S)-avant-retour"
          git tag -a "$NOW" -m "État avant retour à $TARGET" && git push -q origin "$NOW"
          OLDVER=$(git show "$TARGET:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          cp versions.json /tmp/versions.json 2>/dev/null || echo "[]" > /tmp/versions.json
          cp package.json /tmp/package.json
          # fichiers de l'application à l'état de la version visée (sans toucher aux automatismes ni au lanceur)
          PATHS="src assets template.html build.mjs"
          git cat-file -e "$TARGET:tests" 2>/dev/null && PATHS="$PATHS tests"
          git diff --name-only --diff-filter=A "$TARGET" HEAD -- $PATHS | xargs -r git rm -q
          git checkout "$TARGET" -- $PATHS
          cp /tmp/package.json package.json
          npm version patch --no-git-tag-version > /dev/null
          V=$(node -p "require('./package.json').version")
          node -e '
            const fs=require("fs"); let l=JSON.parse(fs.readFileSync("/tmp/versions.json","utf8"));
            l.unshift({ version: process.argv[1], date: new Date().toISOString(), titre: "Retour à la version " + process.argv[2], tag: "version/"+process.argv[1], sauvegarde: process.argv[3], retour: true });
            fs.writeFileSync("versions.json", JSON.stringify(l.slice(0,200), null, 1));' "$V" "$OLDVER" "$NOW"
          git add -A -- . ':!dist'
          git commit -q -m "Retour à la version $OLDVER ($TARGET) – version $V" -m "État précédent sauvegardé : $NOW"
          git tag -a "version/$V" -m "Retour à la version $OLDVER"
          git push -q origin HEAD:main "version/$V"
          gh workflow run pages.yml --ref main
          echo "old=$OLDVER" >> "$GITHUB_OUTPUT"; echo "v=$V" >> "$GITHUB_OUTPUT"
      - name: Informer
        if: env.ISSUE != ''
        run: |
          if [ -n "${{ steps.r.outputs.v }}" ]; then
            gh issue comment "$ISSUE" --body "✅ **Retour effectué** : la version **${{ steps.r.outputs.old }}** est remise en ligne (publiée sous le numéro ${{ steps.r.outputs.v }}). Disponible dans 1 à 2 minutes : clique sur **Mettre à jour** dans l'appli. L'état d'avant reste sauvegardé. <!-- publie:${{ steps.r.outputs.v }} -->"
          else
            gh issue comment "$ISSUE" --body "ℹ️ Il n'y a pas d'autre version sauvegardée à remettre. <!-- statut:repondu -->"
          fi
